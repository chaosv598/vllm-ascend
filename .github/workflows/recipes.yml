name: Recipes

# Validate Huawei-scoped overlays with the upstream renderer workflow and
# renderer code from main, matching the renderer that publishes recipes.vllm.ai.

on:
  pull_request:
    paths:
      - 'recipes/**'
      - '.github/workflows/recipes.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Recipes
    if: github.repository_owner == 'vllm-project' || github.repository == 'chaosv598/vllm-ascend'
    uses: vllm-project/recipes/.github/workflows/validate-recipes.yml@main
    with:
      source: vllm-ascend
      path: recipes

  ascend-validation:
    name: Ascend configuration
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the PR merge revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: source
          sparse-checkout: recipes
          persist-credentials: false
      - name: Check out the PR target revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          sparse-checkout: recipes
          persist-credentials: false
      - name: Check out the official renderer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: vllm-project/recipes
          ref: main
          path: renderer
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: renderer/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: renderer/pnpm-lock.yaml
      - name: Install renderer dependencies
        working-directory: renderer
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Lint and test the checker
        run: |
          for file in source/recipes/tools/*.mjs; do node --check "$file"; done
          renderer/node_modules/.bin/eslint --no-config-lookup --config source/recipes/tools/eslint.config.mjs source/recipes/tools/*.mjs
          node --test source/recipes/tools/test-ascend-checks.mjs
          node source/recipes/tools/test-ascend-integration.mjs --renderer renderer
      - name: Check Ascend configurations against the target branch
        id: check
        run: |
          node source/recipes/tools/validate-ascend.mjs \
            --renderer renderer \
            --recipes source/recipes \
            --baseline-recipes baseline/recipes \
            --report "$RUNNER_TEMP/ascend-recipes/report.json"
      - name: Upload configuration report
        if: ${{ !cancelled() && steps.check.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: ascend-recipe-configurations
          path: ${{ runner.temp }}/ascend-recipes/
          if-no-files-found: warn
          retention-days: 7
